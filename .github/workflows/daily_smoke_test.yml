name: Daily Smoke Test

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  smoke-test:
    name: POST /chat smoke test
    runs-on: ubuntu-latest

    env:
      API_URL: ${{ secrets.API_URL }}
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - name: Send smoke-test request to POST /chat
        id: api_call
        run: |
          HTTP_STATUS=$(curl -s \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${API_KEY}" \
            -d '{
                  "question": "What technologies and tools does Aryan work with?",
                  "k": 5,
                  "temperature": 0.2
                }' \
            --max-time 30 \
            -o response_body.txt \
            -w "%{http_code}" \
            "${API_URL}/chat")
          echo "HTTP_STATUS=${HTTP_STATUS}" >> "$GITHUB_ENV"
          echo "status_code=${HTTP_STATUS}" >> "$GITHUB_OUTPUT"

      - name: Print HTTP status code
        run: |
          echo "HTTP status code: ${{ steps.api_call.outputs.status_code }}"

      - name: Print response body
        run: |
          echo "--- Response body ---"
          cat response_body.txt
          echo ""
          echo "---------------------"

      - name: Assert HTTP 200 OK
        run: |
          if [[ "${{ steps.api_call.outputs.status_code }}" != "200" ]]; then
            echo "Smoke test FAILED — expected HTTP 200, got HTTP ${{ steps.api_call.outputs.status_code }}"
            exit 1
          fi
          echo "Smoke test PASSED — HTTP 200 OK"

      - name: Upload response as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-response
          path: response_body.txt
          retention-days: 7
